ystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">40+ reusable components,</text><text x="433" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">dynamic rendering and</text><text x="433" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">runtime customization.</text><rect x="628.5" y="0.5" width="201" height="104" rx="16" fill="#161618" stroke="#2c2c2e"/><text x="648" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Canvas Editor</text><text x="648" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">Drag-and-drop design with</text><text x="648" y="70" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">a real-time UI preview.</text><rect x="413.5" y="118.5" width="201" height="104" rx="16" fill="#161618" stroke="#2c2c2e"/><text x="433" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Screen Manager</text><text x="433" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">Multi-screen projects,</text><text x="433" y="188" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">navigation flows, and</text><text x="433" y="204" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">screen-level state.</text><rect x="628.5" y="118.5" width="201" height="104" rx="16" fill="#161618" stroke="#2c2c2e"/><text x="648" y="150" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">Versioned Storage</text><text x="648" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">Azure Blob Storage for</text><text x="648" y="188" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="0">versioned project data.</text>
